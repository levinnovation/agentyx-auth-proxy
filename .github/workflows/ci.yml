name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/levinnovation/agentyx-auth-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        if: "" != ""
        run: |
          true
          
